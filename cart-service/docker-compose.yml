version: "3.8"

services:
  # The Cart Microservice
  cart-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
      - "5555:5555"
    environment:
      - PORT=3002
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@cart-db:5432/cart_db?schema=public
      - SERVICE_NAME=cart-service
    volumes:
      - ./src:/app/src
    depends_on:
      - cart-db
    networks:
      - ecommerce-network

  # Dedicated Database for Cart
  cart-db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cart_db
    volumes:
      - cart-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  cart-data:
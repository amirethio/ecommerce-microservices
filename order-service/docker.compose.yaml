version: "3.8"

services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/order?schema=orders
    depends_on:
      - postgres
    networks:
      - order-network

  postgres:
    image: postgres:15.4
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=order
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - order-network

networks:
  order-network:
    driver: bridge

volumes:
  postgres-data:

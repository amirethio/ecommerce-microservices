version: "3.8"

services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3009:3009"
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/inventory
    depends_on:
      - postgres
    networks:
      - inventory-network

  postgres:
    image: postgres:15.4
    ports:
      - "5439:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=inventory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge

volumes:
  postgres-data: